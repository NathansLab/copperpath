[package]
name = "placeroute"
version = "0.1.0"
edition = "2021"
description = "Rule-aware placement helper, routability check and grid router for already-placed KiCad boards"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<user>/placeroute"
readme = "README.md"
keywords = ["kicad", "pcb", "router", "eda", "autorouter"]
categories = ["command-line-utilities", "science"]
exclude = ["docs/*.png"]

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
